name: SonarCloud Analysis

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, instrument and analyze
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build lint, static analysis and JVM coverage
        run: |
          ./gradlew clean \
            :core:compileCommonMainKotlinMetadata \
            detekt \
            :core:lintDebug \
            :core:testDebugUnitTest \
            :core:jacocoDebugUnitTestReport \
            :leisure:lintDebug \
            :leisure:testDebugUnitTest \
            :leisure:jacocoDebugUnitTestReport \
            :leisure:assembleDebug \
            --stacktrace --console=plain --warning-mode=summary \
            --no-problems-report --no-daemon --no-configuration-cache

      # Official emulator-runner Linux setup: KVM is needed for fast CI execution.
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android instrumentation and JaCoCo coverage (API 35)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew \
              :core:createDebugAndroidTestCoverageReport \
              :leisure:createDebugAndroidTestCoverageReport \
              --stacktrace --console=plain --warning-mode=summary \
              --no-problems-report --no-daemon --no-configuration-cache

      - name: Verify unit and instrumented JaCoCo XML, fail if missing
        shell: bash
        run: |
          set -euo pipefail
          reports=()
          for module in core leisure; do
            unit="$GITHUB_WORKSPACE/$module/build/reports/jacoco/jacocoDebugUnitTestReport/jacocoDebugUnitTestReport.xml"
            test -s "$unit"
            grep -q '<report ' "$unit"
            reports+=("$unit")
            instrumented_dir="$GITHUB_WORKSPACE/$module/build/reports/coverage/androidTest/debug/connected"
            test -d "$instrumented_dir"
            instrumented="$(find "$instrumented_dir" -type f -name '*.xml' | sort | head -n 1)"
            test -n "$instrumented" && test -s "$instrumented"
            grep -q '<report ' "$instrumented"
            reports+=("$instrumented")
            echo "$module unit XML: $unit"
            echo "$module AndroidTest XML: $instrumented"
          done
          # Exact paths are sent to Sonar. A green emulator test without imported XML is a failure.
          joined="$(IFS=,; echo "${reports[*]}")"
          echo "VAACHAK_SONAR_COVERAGE_REPORTS=$joined" >> "$GITHUB_ENV"

      - name: Run SonarCloud analysis and quality gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./gradlew sonar \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300 \
            -Dsonar.coverage.jacoco.xmlReportPaths="$VAACHAK_SONAR_COVERAGE_REPORTS" \
            -Dsonar.androidLint.reportPaths="$GITHUB_WORKSPACE/core/build/reports/lint-results-debug.xml,$GITHUB_WORKSPACE/leisure/build/reports/lint-results-debug.xml" \
            --stacktrace --console=plain --warning-mode=summary \
            --no-problems-report --no-daemon --no-configuration-cache

      - name: Upload coverage and test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sonar-reports
          if-no-files-found: warn
          retention-days: 7
          path: |
            core/build/reports/coverage/**
            leisure/build/reports/coverage/**
            core/build/reports/jacoco/**
            leisure/build/reports/jacoco/**
            core/build/reports/lint-*.xml
            leisure/build/reports/lint-*.xml
            **/build/test-results/**
            **/build/outputs/androidTest-results/**
